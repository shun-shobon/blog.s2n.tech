minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@shun-shobon/style-guide"
  # Renovate security update: astro@7.4.7
  - astro@7.4.7

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

publicHoistPattern:
  - "*eslint*"

saveExact: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080

overrides:
  "@cloudflare/vite-plugin": 1.69.0
